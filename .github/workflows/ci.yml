name: Verify learning lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked qclab doctor
      - run: uv run --locked qclab check --reference
      - run: uv run --locked qclab check --lab 02 --reference
      - run: uv run --locked python -m pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
